<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92006F" />
      <stop offset="100%" stop-color="#4A0038" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
  </defs>

  <!-- Golden Wave Ornament -->
  <path d="M 10 130 C 140 160, 220 80, 340 120 C 420 150, 470 110, 490 90" fill="none" stroke="url(#goldGradient)" stroke-width="3" opacity="0.8" />
  <path d="M 30 140 C 160 170, 240 90, 360 130 C 430 155, 480 120, 500 100" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.5" />

  <!-- PCN Typography -->
  <!-- 'P' in Elegant Serif Black -->
  <text x="140" y="115" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="105" font-weight="900" fill="#1A1A1A">P</text>
  
  <!-- 'C' in Stylized Deep Violet Gradient Loop -->
  <text x="210" y="118" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="115" font-weight="900" fill="url(#purpleGradient)">C</text>
  
  <!-- 'N' in Violet-Purple -->
  <text x="295" y="115" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="105" font-weight="900" fill="#6B0052">N</text>

  <!-- Subtitle -->
  <text x="210" y="145" font-family="'Montserrat', 'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="7" fill="#D4AF37">ADVOGADAS</text>
</svg>
